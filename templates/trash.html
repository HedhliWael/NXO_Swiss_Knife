{% extends "base.html" %}

{% block title %}Trash - Swiss Knife{% endblock %}

{% block content %}
<div x-data="trashBin()" class="space-y-6">
    <h1 class="text-2xl font-semibold text-slate-900">Trash Bin</h1>

    <div x-show="error" class="rounded-lg border border-red-200 bg-red-50 p-4 text-sm text-red-700" x-text="error"></div>

    <div class="bg-white rounded-xl border border-slate-200 shadow overflow-hidden">
        <table class="w-full text-sm">
            <thead class="bg-slate-50 text-left text-xs uppercase tracking-wide text-slate-500">
                <tr>
                    <th class="px-4 py-3">Object</th>
                    <th class="px-4 py-3">Type</th>
                    <th class="px-4 py-3">Firewall</th>
                    <th class="px-4 py-3">Deleted By</th>
                    <th class="px-4 py-3">Deleted At</th>
                    <th class="px-4 py-3">Action</th>
                </tr>
            </thead>

            <tbody class="divide-y divide-slate-100">
                <template x-for="item in items" :key="item.trash_id">
                    <tr class="hover:bg-slate-50">
                        <td class="px-4 py-3 font-medium text-slate-900" x-text="item.object.name"></td>
                        <td class="px-4 py-3 text-slate-600" x-text="item.object.object_type"></td>
                        <td class="px-4 py-3 text-slate-600" x-text="item.object.firewall_name || '-'"></td>
                        <td class="px-4 py-3 text-slate-600" x-text="item.deleted_by || 'system'"></td>

                        <td class="px-4 py-3 text-slate-600">
                            <span x-text="item.deleted_at ? new Date(item.deleted_at).toLocaleString() : '-'"></span>
                        </td>

                        <td class="px-4 py-3">
                            <button
                                @click="restore(item)"
                                class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1 rounded-md text-xs font-medium"
                            >
                                Restore
                            </button>
                        </td>
                    </tr>
                </template>
            </tbody>
        </table>

        <div x-show="items.length === 0 && !loading" class="p-10 text-center text-slate-500">
            Trash is empty.
        </div>
    </div>
</div>
{% endblock %}
