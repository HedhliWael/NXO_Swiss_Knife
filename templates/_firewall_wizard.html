<!-- 3-step firewall creation wizard -->
<div x-data='firewallWizard({{ object_types | tojson }})' class="space-y-5">
    <div class="flex items-start justify-between gap-4">
        <h2 class="text-lg font-bold text-slate-900">New Firewall</h2>
        <button @click="showFirewallWizard = false" class="btn-ghost px-2 py-2 text-slate-400">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 6L6 18M6 6l12 12"/>
            </svg>
        </button>
    </div>

    <!-- Step indicator -->
    <div class="step-indicator">
        <span :class="['step-dot', step === 1 ? 'step-dot-active' : step > 1 ? 'step-dot-done' : 'step-dot-inactive']">1. Basic data</span>
        <span :class="['step-dot', step === 2 ? 'step-dot-active' : step > 2 ? 'step-dot-done' : 'step-dot-inactive']">2. Import config</span>
        <span :class="['step-dot', step === 3 ? 'step-dot-active' : 'step-dot-inactive']">3. Create</span>
    </div>

    <!-- Step 1: basic data -->
    <section x-show="step === 1" class="space-y-4">
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="input-label">Name *</label>
                <input type="text" x-model="name" class="input">
            </div>

            <div>
                <label class="input-label">Vendor *</label>
                <select x-model="vendor" class="input">
                    <option value="" disabled selected>Select vendor</option>
                    {% for vendor in vendor_choices %}
                    <option value="{{ vendor }}">{{ vendor }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="input-label">Model</label>
                <input type="text" x-model="model" placeholder="e.g. FortiGate 600E" class="input">
            </div>

            <div>
                <label class="input-label">Management IP</label>
                <input type="text" x-model="management_ip" placeholder="192.168.1.1" class="input">
            </div>
        </div>

        <div class="rounded-lg border border-slate-200 p-4 space-y-3">
            <p class="text-sm font-medium text-slate-700">Authentication</p>

            <label class="flex items-center gap-2 text-sm text-slate-700">
                <input type="radio" x-model="auth_mode" value="password" class="rounded">
                Login / password
            </label>

            <label class="flex items-center gap-2 text-sm text-slate-700">
                <input type="radio" x-model="auth_mode" value="token" class="rounded">
                API token
            </label>

            <div x-show="auth_mode === 'password'" class="grid grid-cols-2 gap-3 pt-1">
                <div>
                    <label class="input-label text-xs">Login</label>
                    <input type="text" x-model="api_username" class="input">
                </div>
                <div>
                    <label class="input-label text-xs">Password</label>
                    <input type="password" x-model="api_password" class="input">
                </div>
            </div>

            <div x-show="auth_mode === 'token'" class="pt-1">
                <label class="input-label text-xs">API token</label>
                <input type="password" x-model="api_token" class="input">
            </div>
        </div>

        <div>
            <label class="input-label">Description</label>
            <textarea x-model="description" rows="2" class="input"></textarea>
        </div>

        <div class="flex justify-end pt-2">
            <button type="button" @click="next()" class="btn btn-primary">Next</button>
        </div>
    </section>

    <!-- Step 2: import configuration -->
    <section x-show="step === 2" class="space-y-4">
        <h3 class="text-lg font-semibold text-slate-900">Import configuration</h3>

        <fieldset class="rounded-lg border border-slate-200 p-4 space-y-3">
            <legend class="text-sm font-medium text-slate-700 px-1">Source</legend>

            <label class="flex items-center gap-2 text-sm text-slate-700">
                <input type="radio" x-model="source" value="file" class="rounded">
                File upload
            </label>

            <label class="flex items-center gap-2 text-sm text-slate-700">
                <input type="radio" x-model="source" value="api" class="rounded">
                REST API request
            </label>

            <div x-show="source === 'file'" class="pt-1">
                <input type="file" x-ref="fileInput" accept=".conf,.xml,.txt,.cfg,.json" class="input">
            </div>

            <div x-show="source === 'api'" class="pt-1 space-y-3">
                <input type="text" x-model="url"
                       placeholder="https://firewall.example.com/api/config"
                       class="input">

                <div class="flex items-center gap-3">
                    <button type="button" @click="checkConnectivity()" :disabled="connBusy"
                            class="btn btn-secondary text-xs disabled:opacity-50">
                        <span x-show="!connBusy">Check connectivity</span>
                        <span x-show="connBusy">Checking...</span>
                    </button>

                    <div x-show="connResult" class="text-sm">
                        <span x-show="connResult && connResult.ok"
                              class="badge badge-success"
                              x-text="connResult && connResult.detail"></span>
                        <span x-show="connResult && !connResult.ok"
                              class="badge badge-danger"
                              x-text="connResult && connResult.detail"></span>
                    </div>
                </div>
            </div>
        </fieldset>

        <p class="text-xs text-slate-400">
            The import runs after the firewall is created. You can skip it on the next step.
        </p>

        <div class="flex justify-between pt-2">
            <button type="button" @click="back()" class="btn btn-secondary">Back</button>
            <button type="button" @click="next()" class="btn btn-primary">Next</button>
        </div>
    </section>

    <!-- Step 3: create -->
    <section x-show="step === 3" class="space-y-4">
        <h3 class="text-lg font-semibold text-slate-900">Create firewall</h3>

        <div class="rounded-lg border border-slate-200 bg-slate-50 p-4 text-sm grid grid-cols-2 gap-x-6 gap-y-1">
            <p><span class="text-slate-500">Name:</span> <span class="font-medium" x-text="name.trim()"></span></p>
            <p><span class="text-slate-500">Vendor:</span> <span x-text="vendor"></span></p>
            <p x-show="model.trim()"><span class="text-slate-500">Model:</span> <span x-text="model.trim()"></span></p>
            <p x-show="management_ip.trim()"><span class="text-slate-500">Mgmt IP:</span> <span x-text="management_ip.trim()"></span></p>
            <p><span class="text-slate-500">Auth:</span> <span x-text="auth_mode === 'token' ? 'API token' : 'Login / password'"></span></p>
        </div>

        <fieldset class="rounded-lg border border-slate-200 p-4 space-y-2">
            <legend class="text-sm font-medium text-slate-700 px-1">Configuration import</legend>
            <label class="flex items-center gap-2 text-sm text-slate-700">
                <input type="radio" x-model="importMode" value="import" class="rounded">
                Import configuration now
            </label>
            <label class="flex items-center gap-2 text-sm text-slate-700">
                <input type="radio" x-model="importMode" value="skip" class="rounded">
                Skip import for now
            </label>
        </fieldset>

        <!-- Progress / result area -->
        <div x-show="created" class="space-y-4">
            <div x-show="progressActive" class="space-y-2">
                <div class="progress-bar">
                    <div class="progress-fill" :style="`width: ${progress}%`"></div>
                </div>
                <p class="text-xs text-slate-500">
                    <span x-text="progressStage"></span>
                    <span x-text="` (${progress}%)`"></span>
                </p>
            </div>

            <div x-show="importResult" class="flash flash-success">
                <p x-text="importResult && importResult.message" style="margin: 0;"></p>
                <template x-if="importResult && importResult.counts">
                    <pre class="mt-2 text-xs overflow-auto bg-white border border-emerald-100 rounded p-2" x-text="JSON.stringify(importResult.counts, null, 2)"></pre>
                </template>
            </div>

            <div x-show="importError" class="flash flash-error" x-text="importError"></div>

            <div x-show="!progressActive" class="flex flex-wrap gap-3 justify-end">
                <a x-show="importResult" :href="objectsUrl()" class="btn btn-secondary text-xs">
                    View imported objects
                </a>
                <button type="button" x-show="!importError" @click="done()"
                        class="btn btn-primary text-xs">
                    Done — go to dashboard
                </button>
            </div>
        </div>

        <div class="flex justify-between" x-show="!created || importError">
            <button type="button" @click="back()" class="btn btn-secondary">Back</button>
            <button type="button" @click="create()" :disabled="creating"
                    class="btn btn-primary disabled:opacity-50">
                <span x-text="creating ? 'Working...' : (created ? 'Import configuration' : 'Create firewall')"></span>
            </button>
        </div>

        <div x-show="stepError" class="flash flash-error" x-text="stepError"></div>
    </section>

    <div x-show="stepError && step === 1" class="flash flash-error" x-text="stepError"></div>
</div>
